<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkout — NOIR CLOTHING CO.</title>
<link rel="icon" href="assets/logo/noir-logo.jpg" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/animations.css" />
<link rel="stylesheet" href="css/responsive.css" />
<style>
  /* Checkout stays visually calmer than the shopping pages, per brief §31 */
  .checkout-page { padding: 150px 0 120px; }
  .checkout-layout { display:grid; grid-template-columns:1.3fr 1fr; gap:64px; margin-top:46px; align-items:start; }
  .checkout-form-group { margin-bottom:36px; }
  .checkout-form-group h3 { font-size:12px; letter-spacing:.1em; color:var(--text-muted); margin-bottom:18px; }
  .field-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
  .field { display:flex; flex-direction:column; gap:8px; }
  .field.full { grid-column:1/-1; }
  .field label { font-size:11.5px; color:var(--text-faint); letter-spacing:.03em; }
  .field input, .field select { border:1px solid var(--border); background:var(--surface-1); height:48px; padding:0 14px; font-size:13.5px; color:var(--text); }
  .field input:focus, .field select:focus { border-color:var(--border-strong); }
  .field-error { font-size:11px; color:#e5a3a3; min-height:14px; }
  .checkout-summary-list { display:flex; flex-direction:column; gap:14px; margin-bottom:20px; max-height:280px; overflow-y:auto; }
  .checkout-summary-row { display:flex; gap:12px; font-size:13px; }
  .checkout-summary-row img { width:56px; aspect-ratio:4/5; object-fit:cover; background:var(--surface-1); }
  .checkout-summary-row .grow { flex:1; }
  .checkout-summary-row .meta { color:var(--text-faint); font-size:11.5px; }
  @media (max-width:1024px){ .checkout-layout{ grid-template-columns:1fr; } .field-row{ grid-template-columns:1fr; } }
</style>
</head>
<body>

<header class="site-header">
  <div class="navbar container is-scrolled" data-navbar>
    <a href="index.html" class="nav-logo">NOIR</a>
    <div class="nav-right" style="margin-left:auto;">
      <span class="meta-text"><i class="fa-solid fa-lock" style="margin-right:8px;"></i>Secure checkout</span>
    </div>
  </div>
</header>

<main>
  <div class="checkout-page container">
    <span class="eyebrow">NOIR / CHECKOUT</span>
    <h1 class="display-lg" style="margin-top:14px;">CHECKOUT.</h1>

    <div class="checkout-layout">
      <form id="checkout-form" novalidate>
        <div class="checkout-form-group">
          <h3>CONTACT</h3>
          <div class="field full">
            <label for="email">Email</label>
            <input type="email" id="email" required />
            <span class="field-error" data-error-for="email"></span>
          </div>
        </div>

        <div class="checkout-form-group">
          <h3>SHIPPING ADDRESS</h3>
          <div class="field-row">
            <div class="field"><label for="fname">First name</label><input type="text" id="fname" required /><span class="field-error" data-error-for="fname"></span></div>
            <div class="field"><label for="lname">Last name</label><input type="text" id="lname" required /><span class="field-error" data-error-for="lname"></span></div>
          </div>
          <div class="field full" style="margin-bottom:16px;">
            <label for="address">Address</label>
            <input type="text" id="address" required />
            <span class="field-error" data-error-for="address"></span>
          </div>
          <div class="field-row">
            <div class="field"><label for="city">City</label><input type="text" id="city" required /><span class="field-error" data-error-for="city"></span></div>
            <div class="field"><label for="postcode">Postal code</label><input type="text" id="postcode" required /><span class="field-error" data-error-for="postcode"></span></div>
          </div>
        </div>

        <div class="checkout-form-group">
          <h3>PAYMENT</h3>
          <div class="field full" style="margin-bottom:16px;">
            <label for="card">Card number</label>
            <input type="text" id="card" placeholder="•••• •••• •••• ••••" required />
            <span class="field-error" data-error-for="card"></span>
          </div>
          <div class="field-row">
            <div class="field"><label for="expiry">Expiry</label><input type="text" id="expiry" placeholder="MM / YY" required /><span class="field-error" data-error-for="expiry"></span></div>
            <div class="field"><label for="cvc">CVC</label><input type="text" id="cvc" required /><span class="field-error" data-error-for="cvc"></span></div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full" style="height:58px;">PLACE ORDER</button>
      </form>

      <div class="summary-box">
        <h3>ORDER SUMMARY</h3>
        <div class="checkout-summary-list" data-checkout-summary-list></div>
        <div class="summary-row"><span>Subtotal</span><span data-checkout-subtotal>Rp0</span></div>
        <div class="summary-row"><span>Shipping</span><span data-checkout-shipping>—</span></div>
        <div class="summary-row total"><span>Total</span><span data-checkout-total>Rp0</span></div>
      </div>
    </div>
  </div>
</main>

<script src="js/products.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/cart.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const items = NOIR.getCart();
    const list = document.querySelector("[data-checkout-summary-list]");

    if (!items.length) {
      list.innerHTML = `<p style="color:var(--text-muted);font-size:13px;">Your bag is empty — <a href="shop.html" style="text-decoration:underline;">go pick something out</a>.</p>`;
      document.getElementById("checkout-form").querySelector("button[type=submit]").setAttribute("disabled", "true");
    } else {
      list.innerHTML = items
        .map(
          (i) => `
        <div class="checkout-summary-row">
          <img src="${i.image}" alt="${i.name}" />
          <div class="grow">
            <div>${i.name} × ${i.qty}</div>
            <div class="meta">${i.color} / ${i.size}</div>
          </div>
          <div>${NOIR.formatPrice(i.price * i.qty)}</div>
        </div>`
        )
        .join("");
    }

    const subtotal = NOIR.cartSubtotal();
    const shipping = subtotal === 0 || subtotal >= 500000 ? 0 : 29000;
    document.querySelector("[data-checkout-subtotal]").textContent = NOIR.formatPrice(subtotal);
    document.querySelector("[data-checkout-shipping]").textContent = shipping === 0 ? "Free" : NOIR.formatPrice(shipping);
    document.querySelector("[data-checkout-total]").textContent = NOIR.formatPrice(subtotal + shipping);

    document.getElementById("checkout-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const fields = ["email", "fname", "lname", "address", "city", "postcode", "card", "expiry", "cvc"];
      let valid = true;
      fields.forEach((id) => {
        const input = document.getElementById(id);
        const errorEl = document.querySelector(`[data-error-for="${id}"]`);
        if (!input.value.trim()) {
          errorEl.textContent = "Required";
          valid = false;
        } else if (id === "email" && !input.value.includes("@")) {
          errorEl.textContent = "Enter a valid email";
          valid = false;
        } else {
          errorEl.textContent = "";
        }
      });
      if (!valid) return;
      localStorage.removeItem("noir_cart");
      document.querySelector(".checkout-page").innerHTML = `
        <div class="state-empty">
          <i class="fa-solid fa-check"></i>
          <p class="display-md" style="margin-bottom:12px;">Order placed.</p>
          <p>A confirmation has been sent to your inbox. Welcome to NOIR.</p>
          <a href="index.html" class="btn btn-primary">BACK TO HOME</a>
        </div>`;
    });
  });
</script>
</body>
</html>
